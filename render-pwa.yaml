services:
  - type: web
    name: reflection-pwa-server
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --app-dir src --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MCP_SERVER_URL
        value: https://reflection-mcp-server.onrender.com/sse
      - key: PYTHON_VERSION
        value: 3.11.0
