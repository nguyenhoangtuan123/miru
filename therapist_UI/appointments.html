<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lich hen - Miru Therapist</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="/pwa/images/favicon.svg">
    <style>
        .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-6); }
        .calendar-nav { display: flex; align-items: center; gap: var(--space-3); }
        .calendar-title { font-size: 1.25rem; font-weight: 600; min-width: 200px; text-align: center; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
        .calendar-day-header { background: var(--color-bg); padding: var(--space-3); text-align: center; font-weight: 600; font-size: 0.875rem; color: var(--color-text-muted); }
        .calendar-day { background: var(--color-bg-card); min-height: 120px; padding: var(--space-2); cursor: pointer; transition: background var(--transition-fast); }
        .calendar-day:hover { background: var(--color-border-light); }
        .calendar-day.other-month { opacity: 0.4; }
        .calendar-day.today { background: rgba(127, 13, 242, 0.05); }
        .calendar-day-number { font-weight: 600; font-size: 0.875rem; color: var(--color-text); margin-bottom: var(--space-2); }
        .calendar-day.today .calendar-day-number { background: var(--color-primary); color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .calendar-event { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .calendar-event.scheduled { background: rgba(127, 13, 242, 0.15); color: var(--color-primary-dark); }
        .calendar-event.completed { background: var(--color-success-light); color: var(--color-success); }
        .calendar-event.cancelled { background: var(--color-danger-light); color: var(--color-danger); text-decoration: line-through; }
        .view-toggle { display: flex; gap: 1px; background: var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
        .view-toggle button { padding: var(--space-2) var(--space-4); background: var(--color-bg-card); border: none; cursor: pointer; font-weight: 500; transition: all var(--transition-fast); }
        .view-toggle button.active { background: var(--color-primary); color: white; }
        .list-view { display: none; }
        .list-view.active { display: block; }
        .calendar-view.active { display: grid; }
        .appointment-list-item { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: var(--space-3); transition: all var(--transition-fast); }
        .appointment-list-item:hover { border-color: var(--color-primary-light); box-shadow: var(--shadow-md); }
        .time-slot { text-align: center; min-width: 80px; }
        .time-slot-time { font-size: 1.125rem; font-weight: 700; }
        .time-slot-date { font-size: 0.75rem; color: var(--color-text-muted); }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="logo-text">
                    Miru
                    <span>Therapist Portal</span>
                </div>
            </div>

            <nav class="nav">
                <div class="nav-section">
                    <div class="nav-section-title">Tong quan</div>
                    <a href="dashboard.html" class="nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                        </svg>
                        Dashboard
                    </a>
                    <a href="clients.html" class="nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                        </svg>
                        Than chu
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Quan ly</div>
                    <a href="appointments.html" class="nav-item active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        Lich hen
                    </a>
                    <a href="messages.html" class="nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        Tin nhan
                    </a>
                </div>
            </nav>

            <div class="user-profile">
                <div class="user-avatar" id="user-avatar">T</div>
                <div class="user-info">
                    <div class="user-name" id="user-name">Loading...</div>
                    <div class="user-role">Nha tri lieu</div>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="logout()" title="Dang xuat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
                <h1>Lich hen</h1>
                <button class="btn btn-primary" onclick="openAppointmentModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Tao lich hen
                </button>
            </div>

            <!-- Calendar Header -->
            <div class="card mb-6">
                <div class="calendar-header">
                    <div class="calendar-nav">
                        <button class="btn btn-ghost btn-sm" onclick="prevMonth()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <polyline points="15 18 9 12 15 6"/>
                            </svg>
                        </button>
                        <span class="calendar-title" id="calendar-title">Thang 1, 2024</span>
                        <button class="btn btn-ghost btn-sm" onclick="nextMonth()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <polyline points="9 18 15 12 9 6"/>
                            </svg>
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="goToToday()">Hom nay</button>
                    </div>
                    <div class="view-toggle">
                        <button class="active" onclick="setView('calendar')" id="btn-calendar-view">Lich</button>
                        <button onclick="setView('list')" id="btn-list-view">Danh sach</button>
                    </div>
                </div>

                <!-- Calendar View -->
                <div class="calendar-grid calendar-view active" id="calendar-grid">
                    <div class="calendar-day-header">CN</div>
                    <div class="calendar-day-header">T2</div>
                    <div class="calendar-day-header">T3</div>
                    <div class="calendar-day-header">T4</div>
                    <div class="calendar-day-header">T5</div>
                    <div class="calendar-day-header">T6</div>
                    <div class="calendar-day-header">T7</div>
                    <!-- Days will be rendered here -->
                </div>

                <!-- List View -->
                <div class="list-view" id="list-view">
                    <div id="appointments-list">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>

            <!-- Today's Summary -->
            <div class="grid-2">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Hom nay</h3>
                    </div>
                    <div id="today-appointments">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Sap toi</h3>
                    </div>
                    <div id="upcoming-appointments">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Appointment Modal -->
    <div class="modal-overlay" id="appointment-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Tao lich hen moi</h3>
                <button class="modal-close" onclick="closeAppointmentModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="appointment-form">
                    <input type="hidden" id="appointment-id">
                    <div class="form-group">
                        <label class="form-label">Than chu</label>
                        <select class="form-select" id="apt-client" required>
                            <option value="">Chon than chu...</option>
                        </select>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label class="form-label">Ngay</label>
                            <input type="date" class="form-input" id="apt-date" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Gio</label>
                            <input type="time" class="form-input" id="apt-time" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Thoi luong (phut)</label>
                        <select class="form-select" id="apt-duration">
                            <option value="30">30 phut</option>
                            <option value="45">45 phut</option>
                            <option value="60" selected>60 phut</option>
                            <option value="90">90 phut</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Loai</label>
                        <select class="form-select" id="apt-type">
                            <option value="individual">Ca nhan</option>
                            <option value="group">Nhom</option>
                            <option value="follow_up">Theo doi</option>
                            <option value="crisis">Khung hoang</option>
                            <option value="assessment">Danh gia</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ghi chu</label>
                        <textarea class="form-textarea" id="apt-notes" rows="2" placeholder="Ghi chu them..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAppointmentModal()">Huy</button>
                <button class="btn btn-primary" onclick="saveAppointment()">Luu</button>
            </div>
        </div>
    </div>

    <!-- Appointment Detail Modal -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Chi tiet lich hen</h3>
                <button class="modal-close" onclick="closeDetailModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="detail-content">
                <div class="loading"><div class="spinner"></div></div>
            </div>
            <div class="modal-footer" id="detail-footer">
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script>
        const API_BASE = window.CONFIG?.API_BASE || '';
        const therapistId = localStorage.getItem('user_id');
        let currentDate = new Date();
        let allAppointments = [];
        let allClients = [];
        let currentView = 'calendar';
        let selectedAppointment = null;

        if (!therapistId) {
            window.location.href = '/app/auth';
        }

        // Check URL params for pre-filled data
        const urlParams = new URLSearchParams(window.location.search);
        const preSelectedClient = urlParams.get('client');
        const openNew = urlParams.get('new');

        document.addEventListener('DOMContentLoaded', async () => {
            await loadUserProfile();
            await loadClients();
            await loadAppointments();
            renderCalendar();
            loadTodayAppointments();
            loadUpcomingAppointments();

            if (openNew === '1') {
                openAppointmentModal();
            }
        });

        async function loadUserProfile() {
            try {
                const res = await fetch(`${API_BASE}/api/users/${therapistId}/profile`);
                if (res.ok) {
                    const data = await res.json();
                    const profile = data.profile || {};
                    document.getElementById('user-name').textContent = profile.display_name || 'Therapist';
                    document.getElementById('user-avatar').textContent = (profile.display_name || 'T')[0].toUpperCase();
                }
            } catch (err) {
                console.error('Failed to load profile:', err);
                document.getElementById('user-name').textContent = 'Therapist';
            }
        }

        async function loadClients() {
            try {
                const res = await fetch(`${API_BASE}/api/therapist/clients/${therapistId}`);
                if (res.ok) {
                    const data = await res.json();
                    allClients = data.clients || [];
                    populateClientSelect();
                }
            } catch (err) {
                console.error('Failed to load clients:', err);
            }
        }

        function populateClientSelect() {
            const select = document.getElementById('apt-client');
            select.innerHTML = '<option value="">Chon than chu...</option>' + 
                allClients.map(c => `<option value="${c.client_id}" ${c.client_id === preSelectedClient ? 'selected' : ''}>${c.display_name || 'Khong ten'}</option>`).join('');
        }

        async function loadAppointments() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            
            try {
                const res = await fetch(`${API_BASE}/api/therapist/appointments/${therapistId}?year=${year}&month=${month}`);
                if (res.ok) {
                    const data = await res.json();
                    allAppointments = data.appointments || [];
                    renderCalendar();
                    renderListView();
                }
            } catch (err) {
                console.error('Failed to load appointments:', err);
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('calendar-title').textContent = 
                `Thang ${month + 1}, ${year}`;

            // Clear existing days (keep headers)
            const headers = Array.from(grid.querySelectorAll('.calendar-day-header'));
            grid.innerHTML = '';
            headers.forEach(h => grid.appendChild(h));

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();
            const totalDays = lastDay.getDate();

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Previous month days
            const prevMonth = new Date(year, month, 0);
            for (let i = startDay - 1; i >= 0; i--) {
                const day = prevMonth.getDate() - i;
                const dayEl = createDayElement(day, true, new Date(year, month - 1, day));
                grid.appendChild(dayEl);
            }

            // Current month days
            for (let day = 1; day <= totalDays; day++) {
                const date = new Date(year, month, day);
                const isToday = date.getTime() === today.getTime();
                const dayEl = createDayElement(day, false, date, isToday);
                grid.appendChild(dayEl);
            }

            // Next month days
            const remaining = 42 - grid.querySelectorAll('.calendar-day').length;
            for (let day = 1; day <= remaining; day++) {
                const dayEl = createDayElement(day, true, new Date(year, month + 1, day));
                grid.appendChild(dayEl);
            }
        }

        function createDayElement(day, isOtherMonth, date, isToday = false) {
            const el = document.createElement('div');
            el.className = `calendar-day${isOtherMonth ? ' other-month' : ''}${isToday ? ' today' : ''}`;
            
            const dateStr = date.toISOString().split('T')[0];
            const dayAppointments = allAppointments.filter(apt => {
                const aptDate = new Date(apt.scheduled_at).toISOString().split('T')[0];
                return aptDate === dateStr;
            });

            el.innerHTML = `
                <div class="calendar-day-number">${day}</div>
                ${dayAppointments.slice(0, 3).map(apt => `
                    <div class="calendar-event ${apt.status}" onclick="event.stopPropagation(); openAppointmentDetail('${apt.id}')">
                        ${formatTime(apt.scheduled_at)} ${getClientName(apt.client_id)}
                    </div>
                `).join('')}
                ${dayAppointments.length > 3 ? `<div class="text-xs text-muted">+${dayAppointments.length - 3} khac</div>` : ''}
            `;

            el.addEventListener('click', () => {
                document.getElementById('apt-date').value = dateStr;
                openAppointmentModal();
            });

            return el;
        }

        function renderListView() {
            const container = document.getElementById('appointments-list');
            
            if (allAppointments.length === 0) {
                container.innerHTML = '<p class="text-muted text-center" style="padding: var(--space-6);">Khong co lich hen trong thang nay</p>';
                return;
            }

            const sorted = [...allAppointments].sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));

            container.innerHTML = sorted.map(apt => `
                <div class="appointment-list-item" onclick="openAppointmentDetail('${apt.id}')">
                    <div class="time-slot">
                        <div class="time-slot-time">${formatTime(apt.scheduled_at)}</div>
                        <div class="time-slot-date">${formatDate(apt.scheduled_at)}</div>
                    </div>
                    <div style="flex: 1;">
                        <div class="font-bold">${getClientName(apt.client_id)}</div>
                        <div class="text-sm text-muted">${apt.type || 'Ca nhan'} - ${apt.duration_minutes || 60} phut</div>
                    </div>
                    <span class="badge ${apt.status === 'completed' ? 'badge-success' : apt.status === 'cancelled' ? 'badge-danger' : 'badge-info'}">
                        ${apt.status === 'completed' ? 'Hoan thanh' : apt.status === 'cancelled' ? 'Da huy' : 'Da len lich'}
                    </span>
                </div>
            `).join('');
        }

        async function loadTodayAppointments() {
            const container = document.getElementById('today-appointments');
            try {
                const res = await fetch(`${API_BASE}/api/therapist/appointments/${therapistId}/today`);
                if (res.ok) {
                    const data = await res.json();
                    const apts = data.appointments || [];
                    if (apts.length === 0) {
                        container.innerHTML = '<p class="text-muted">Khong co lich hen hom nay</p>';
                    } else {
                        container.innerHTML = apts.map(apt => `
                            <div class="appointment-card" onclick="openAppointmentDetail('${apt.id}')" style="cursor: pointer;">
                                <div class="appointment-time">
                                    <div class="appointment-hour">${formatTime(apt.scheduled_at)}</div>
                                </div>
                                <div class="appointment-details">
                                    <div class="appointment-client">${getClientName(apt.client_id)}</div>
                                    <div class="appointment-type">${apt.type || 'Ca nhan'}</div>
                                </div>
                                <span class="badge ${apt.status === 'completed' ? 'badge-success' : 'badge-info'}">
                                    ${apt.status === 'completed' ? 'Xong' : 'Cho'}
                                </span>
                            </div>
                        `).join('');
                    }
                }
            } catch (err) {
                container.innerHTML = '<p class="text-muted">Khong the tai du lieu</p>';
            }
        }

        async function loadUpcomingAppointments() {
            const container = document.getElementById('upcoming-appointments');
            try {
                const res = await fetch(`${API_BASE}/api/therapist/appointments/${therapistId}/upcoming?limit=5`);
                if (res.ok) {
                    const data = await res.json();
                    const apts = data.appointments || [];
                    if (apts.length === 0) {
                        container.innerHTML = '<p class="text-muted">Khong co lich hen sap toi</p>';
                    } else {
                        container.innerHTML = apts.map(apt => `
                            <div class="appointment-card" onclick="openAppointmentDetail('${apt.id}')" style="cursor: pointer;">
                                <div class="appointment-time">
                                    <div class="appointment-hour">${formatTime(apt.scheduled_at)}</div>
                                    <div class="appointment-minutes">${formatDate(apt.scheduled_at)}</div>
                                </div>
                                <div class="appointment-details">
                                    <div class="appointment-client">${getClientName(apt.client_id)}</div>
                                    <div class="appointment-type">${apt.type || 'Ca nhan'}</div>
                                </div>
                            </div>
                        `).join('');
                    }
                }
            } catch (err) {
                container.innerHTML = '<p class="text-muted">Khong the tai du lieu</p>';
            }
        }

        // Calendar navigation
        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            loadAppointments();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            loadAppointments();
        }

        function goToToday() {
            currentDate = new Date();
            loadAppointments();
        }

        // View toggle
        function setView(view) {
            currentView = view;
            document.getElementById('btn-calendar-view').classList.toggle('active', view === 'calendar');
            document.getElementById('btn-list-view').classList.toggle('active', view === 'list');
            document.getElementById('calendar-grid').classList.toggle('active', view === 'calendar');
            document.getElementById('list-view').classList.toggle('active', view === 'list');
        }

        // Modal functions
        function openAppointmentModal() {
            document.getElementById('modal-title').textContent = 'Tao lich hen moi';
            document.getElementById('appointment-form').reset();
            document.getElementById('appointment-id').value = '';
            
            // Set default date to today
            if (!document.getElementById('apt-date').value) {
                document.getElementById('apt-date').value = new Date().toISOString().split('T')[0];
            }
            
            // Re-populate client select in case pre-selected
            populateClientSelect();
            
            document.getElementById('appointment-modal').classList.add('open');
        }

        function closeAppointmentModal() {
            document.getElementById('appointment-modal').classList.remove('open');
        }

        async function saveAppointment() {
            const id = document.getElementById('appointment-id').value;
            const clientId = document.getElementById('apt-client').value;
            const date = document.getElementById('apt-date').value;
            const time = document.getElementById('apt-time').value;
            const duration = document.getElementById('apt-duration').value;
            const type = document.getElementById('apt-type').value;
            const notes = document.getElementById('apt-notes').value;

            if (!clientId || !date || !time) {
                alert('Vui long dien day du thong tin');
                return;
            }

            const scheduledAt = `${date}T${time}:00`;

            const data = {
                client_id: clientId,
                scheduled_at: scheduledAt,
                duration_minutes: parseInt(duration),
                type,
                notes
            };

            try {
                const url = id 
                    ? `${API_BASE}/api/therapist/appointments/${therapistId}/${id}`
                    : `${API_BASE}/api/therapist/appointments/${therapistId}`;
                const res = await fetch(url, {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    closeAppointmentModal();
                    loadAppointments();
                    loadTodayAppointments();
                    loadUpcomingAppointments();
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Khong the luu lich hen');
                }
            } catch (err) {
                console.error('Failed to save appointment:', err);
                alert('Loi ket noi');
            }
        }

        async function openAppointmentDetail(id) {
            selectedAppointment = allAppointments.find(a => a.id === id);
            if (!selectedAppointment) return;

            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('detail-content');
            const footer = document.getElementById('detail-footer');

            const apt = selectedAppointment;
            const client = allClients.find(c => c.client_id === apt.client_id);

            content.innerHTML = `
                <div class="flex items-center gap-4 mb-6">
                    <div class="client-avatar" style="width: 56px; height: 56px; font-size: 1.25rem;">
                        ${(client?.display_name || 'U')[0].toUpperCase()}
                    </div>
                    <div>
                        <h3 style="margin-bottom: 4px;">${client?.display_name || 'Khong co ten'}</h3>
                        <p class="text-muted">${client?.email || ''}</p>
                    </div>
                </div>
                <div class="info-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4);">
                    <div>
                        <div class="text-xs text-muted" style="text-transform: uppercase; margin-bottom: 4px;">Thoi gian</div>
                        <div class="font-bold">${formatDateTime(apt.scheduled_at)}</div>
                    </div>
                    <div>
                        <div class="text-xs text-muted" style="text-transform: uppercase; margin-bottom: 4px;">Thoi luong</div>
                        <div class="font-bold">${apt.duration_minutes || 60} phut</div>
                    </div>
                    <div>
                        <div class="text-xs text-muted" style="text-transform: uppercase; margin-bottom: 4px;">Loai</div>
                        <div class="font-bold">${apt.type || 'Ca nhan'}</div>
                    </div>
                    <div>
                        <div class="text-xs text-muted" style="text-transform: uppercase; margin-bottom: 4px;">Trang thai</div>
                        <span class="badge ${apt.status === 'completed' ? 'badge-success' : apt.status === 'cancelled' ? 'badge-danger' : 'badge-info'}">
                            ${apt.status === 'completed' ? 'Hoan thanh' : apt.status === 'cancelled' ? 'Da huy' : 'Da len lich'}
                        </span>
                    </div>
                </div>
                ${apt.notes ? `<div class="mt-4"><div class="text-xs text-muted" style="text-transform: uppercase; margin-bottom: 4px;">Ghi chu</div><p>${apt.notes}</p></div>` : ''}
            `;

            let footerHtml = '<button class="btn btn-secondary" onclick="closeDetailModal()">Dong</button>';
            if (apt.status === 'scheduled') {
                footerHtml += `
                    <button class="btn btn-ghost" onclick="editAppointment('${apt.id}')">Sua</button>
                    <button class="btn btn-danger" onclick="cancelAppointment('${apt.id}')">Huy lich</button>
                    <button class="btn btn-success" onclick="completeAppointment('${apt.id}')">Hoan thanh</button>
                `;
            }
            footer.innerHTML = footerHtml;

            modal.classList.add('open');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.remove('open');
            selectedAppointment = null;
        }

        function editAppointment(id) {
            const apt = allAppointments.find(a => a.id === id);
            if (!apt) return;

            closeDetailModal();

            document.getElementById('modal-title').textContent = 'Sua lich hen';
            document.getElementById('appointment-id').value = apt.id;
            document.getElementById('apt-client').value = apt.client_id;
            
            const dt = new Date(apt.scheduled_at);
            document.getElementById('apt-date').value = dt.toISOString().split('T')[0];
            document.getElementById('apt-time').value = dt.toTimeString().slice(0, 5);
            document.getElementById('apt-duration').value = apt.duration_minutes || 60;
            document.getElementById('apt-type').value = apt.type || 'individual';
            document.getElementById('apt-notes').value = apt.notes || '';

            document.getElementById('appointment-modal').classList.add('open');
        }

        async function cancelAppointment(id) {
            if (!confirm('Ban co chac muon huy lich hen nay?')) return;

            try {
                const res = await fetch(`${API_BASE}/api/therapist/appointments/${therapistId}/${id}/cancel`, {
                    method: 'POST'
                });
                if (res.ok) {
                    closeDetailModal();
                    loadAppointments();
                    loadTodayAppointments();
                    loadUpcomingAppointments();
                }
            } catch (err) {
                console.error('Failed to cancel:', err);
            }
        }

        async function completeAppointment(id) {
            try {
                const res = await fetch(`${API_BASE}/api/therapist/appointments/${therapistId}/${id}/complete`, {
                    method: 'POST'
                });
                if (res.ok) {
                    closeDetailModal();
                    loadAppointments();
                    loadTodayAppointments();
                    loadUpcomingAppointments();
                }
            } catch (err) {
                console.error('Failed to complete:', err);
            }
        }

        // Helpers
        function getClientName(clientId) {
            const client = allClients.find(c => c.client_id === clientId);
            return client?.display_name || 'Khong ten';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('vi-VN');
        }

        function formatTime(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleString('vi-VN');
        }

        function logout() {
            localStorage.removeItem('user_id');
            window.location.href = '/app/auth';
        }
    </script>
</body>
</html>
