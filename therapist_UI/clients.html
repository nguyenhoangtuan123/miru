<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Than chu - Miru Therapist</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="/pwa/images/favicon.svg">
</head>
<body>
    <div class="layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="logo-text">
                    Miru
                    <span>Therapist Portal</span>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="nav">
                <div class="nav-section">
                    <div class="nav-section-title">Tong quan</div>
                    <a href="dashboard.html" class="nav-item" data-page="dashboard">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                        </svg>
                        Dashboard
                    </a>
                    <a href="clients.html" class="nav-item active" data-page="clients">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        Than chu
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Quan ly</div>
                    <a href="appointments.html" class="nav-item" data-page="appointments">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        Lich hen
                    </a>
                    <a href="messages.html" class="nav-item" data-page="messages">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        Tin nhan
                        <span class="badge" id="unread-badge" style="display: none;">0</span>
                    </a>
                </div>
            </nav>

            <!-- User Profile -->
            <div class="user-profile">
                <div class="user-avatar" id="user-avatar">T</div>
                <div class="user-info">
                    <div class="user-name" id="user-name">Loading...</div>
                    <div class="user-role">Nha tri lieu</div>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="logout()" title="Dang xuat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Page Header -->
            <div class="flex items-center justify-between mb-6">
                <h1>Than chu cua toi</h1>
                <button class="btn btn-primary" onclick="openAddClientModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Them than chu
                </button>
            </div>

            <!-- Search and Filters -->
            <div class="card mb-6">
                <div class="flex gap-4 items-center">
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <div style="position: relative;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            <input type="text" class="form-input" id="search-input" placeholder="Tim kiem theo ten, email..." style="padding-left: 40px;">
                        </div>
                    </div>
                    <select class="form-select" id="filter-status" style="width: auto;">
                        <option value="all">Tat ca trang thai</option>
                        <option value="active">Dang hoat dong</option>
                        <option value="inactive">Khong hoat dong</option>
                    </select>
                    <select class="form-select" id="sort-by" style="width: auto;">
                        <option value="name">Sap xep theo ten</option>
                        <option value="recent">Gan day nhat</option>
                        <option value="sessions">Nhieu phien nhat</option>
                    </select>
                </div>
            </div>

            <!-- Clients Grid -->
            <div id="clients-container">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Client Modal -->
    <div class="modal-overlay" id="add-client-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Them than chu moi</h3>
                <button class="modal-close" onclick="closeAddClientModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="add-client-form">
                    <div class="form-group">
                        <label class="form-label">Ma ghep noi (Pairing Code)</label>
                        <input type="text" class="form-input" id="pairing-code" placeholder="Nhap ma tu than chu" required>
                        <p class="text-sm text-muted mt-2">Than chu se cung cap ma nay tu ung dung cua ho</p>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ghi chu (tuy chon)</label>
                        <textarea class="form-textarea" id="client-notes" rows="3" placeholder="Ghi chu ve than chu..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddClientModal()">Huy</button>
                <button class="btn btn-primary" onclick="pairClient()">Ghep noi</button>
            </div>
        </div>
    </div>

    <!-- Client Detail Modal -->
    <div class="modal-overlay" id="client-detail-modal">
        <div class="modal" style="max-width: 700px;">
            <div class="modal-header">
                <h3 class="modal-title" id="detail-client-name">Chi tiet than chu</h3>
                <button class="modal-close" onclick="closeClientDetailModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="client-detail-content">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeClientDetailModal()">Dong</button>
                <button class="btn btn-primary" id="btn-view-full" onclick="viewFullProfile()">Xem ho so day du</button>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script src="api.js"></script>
    <script>
        // Config
        const API_BASE = window.CONFIG?.API_BASE || '';
        let therapistId = localStorage.getItem('user_id');
        let allClients = [];
        let selectedClientId = null;

        // Check login
        if (!therapistId) {
            window.location.href = '/app/auth';
        }

        // Use TherapistAPI helper
        const api = window.TherapistAPI;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadUserProfile();
            loadClients();
            loadUnreadCount();

            // Search listeners
            document.getElementById('search-input').addEventListener('input', debounce(filterClients, 300));
            document.getElementById('filter-status').addEventListener('change', filterClients);
            document.getElementById('sort-by').addEventListener('change', filterClients);
        });

        // Debounce helper
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // Load user profile
        async function loadUserProfile() {
            try {
                const profile = await api.getProfile();
                if (profile) {
                    document.getElementById('user-name').textContent = profile.display_name || 'Therapist';
                    document.getElementById('user-avatar').textContent = (profile.display_name || 'T')[0].toUpperCase();
                }
            } catch (err) {
                console.error('Failed to load profile:', err);
                document.getElementById('user-name').textContent = 'Therapist';
            }
        }

        // Load clients
        async function loadClients() {
            try {
                allClients = await api.getClients();
                renderClients(allClients);
            } catch (err) {
                console.error('Failed to load clients:', err);
                showError('Khong the tai danh sach than chu');
            }
        }

        // Filter and sort clients
        function filterClients() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const status = document.getElementById('filter-status').value;
            const sortBy = document.getElementById('sort-by').value;

            let filtered = allClients.filter(client => {
                const matchSearch = !search || 
                    (client.display_name || '').toLowerCase().includes(search) ||
                    (client.email || '').toLowerCase().includes(search);
                
                const matchStatus = status === 'all' || 
                    (status === 'active' && client.is_active) ||
                    (status === 'inactive' && !client.is_active);

                return matchSearch && matchStatus;
            });

            // Sort
            filtered.sort((a, b) => {
                switch (sortBy) {
                    case 'name':
                        return (a.display_name || '').localeCompare(b.display_name || '');
                    case 'recent':
                        return new Date(b.paired_at || 0) - new Date(a.paired_at || 0);
                    case 'sessions':
                        return (b.session_count || 0) - (a.session_count || 0);
                    default:
                        return 0;
                }
            });

            renderClients(filtered);
        }

        // Render clients
        function renderClients(clients) {
            const container = document.getElementById('clients-container');

            if (clients.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                        </svg>
                        <h3>Chua co than chu</h3>
                        <p>Bam "Them than chu" de bat dau ghep noi voi than chu moi.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="clients-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-5);">
                    ${clients.map(client => `
                        <div class="card client-card" onclick="openClientDetail('${client.client_id}')" style="cursor: pointer; transition: all var(--transition-fast);">
                            <div class="flex items-center gap-4 mb-4">
                                <div class="client-avatar" style="width: 56px; height: 56px; font-size: 1.25rem;">
                                    ${(client.display_name || 'U')[0].toUpperCase()}
                                </div>
                                <div style="flex: 1;">
                                    <div class="font-bold" style="font-size: 1.125rem;">${client.display_name || 'Khong co ten'}</div>
                                    <div class="text-sm text-muted">${client.email || 'Khong co email'}</div>
                                </div>
                                <span class="badge ${client.is_active ? 'badge-success' : 'badge-warning'}">
                                    ${client.is_active ? 'Hoat dong' : 'Khong hoat dong'}
                                </span>
                            </div>
                            <div class="flex gap-4 text-sm text-muted">
                                <div class="flex items-center gap-2">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                        <line x1="16" y1="2" x2="16" y2="6"/>
                                        <line x1="8" y1="2" x2="8" y2="6"/>
                                    </svg>
                                    ${client.session_count || 0} phien
                                </div>
                                <div class="flex items-center gap-2">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                        <circle cx="12" cy="12" r="10"/>
                                        <polyline points="12 6 12 12 16 14"/>
                                    </svg>
                                    ${formatDate(client.last_session)}
                                </div>
                            </div>
                            ${client.notes ? `<div class="text-sm text-muted mt-3" style="border-top: 1px solid var(--color-border); padding-top: var(--space-3);">${truncate(client.notes, 80)}</div>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;

            // Add hover effect
            container.querySelectorAll('.client-card').forEach(card => {
                card.addEventListener('mouseenter', () => {
                    card.style.borderColor = 'var(--color-primary-light)';
                    card.style.boxShadow = 'var(--shadow-md)';
                });
                card.addEventListener('mouseleave', () => {
                    card.style.borderColor = 'var(--color-border)';
                    card.style.boxShadow = 'var(--shadow-sm)';
                });
            });
        }

        // Open client detail
        async function openClientDetail(clientId) {
            selectedClientId = clientId;
            const modal = document.getElementById('client-detail-modal');
            modal.classList.add('open');

            const content = document.getElementById('client-detail-content');
            content.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const data = await api.getClientSummary(clientId);
                document.getElementById('detail-client-name').textContent = data.display_name || 'Chi tiet than chu';
                renderClientDetail(data);
            } catch (err) {
                console.error('Failed to load client detail:', err);
                content.innerHTML = '<p class="text-muted">Khong the tai thong tin than chu</p>';
            }
        }

        // Render client detail
        function renderClientDetail(client) {
            const content = document.getElementById('client-detail-content');
            content.innerHTML = `
                <div class="flex items-center gap-4 mb-6">
                    <div class="client-avatar" style="width: 72px; height: 72px; font-size: 1.5rem;">
                        ${(client.display_name || 'U')[0].toUpperCase()}
                    </div>
                    <div>
                        <h2 style="margin-bottom: 4px;">${client.display_name || 'Khong co ten'}</h2>
                        <p class="text-muted">${client.email || 'Khong co email'}</p>
                    </div>
                </div>

                <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: var(--space-6);">
                    <div class="stat-card" style="padding: var(--space-4);">
                        <div class="stat-content">
                            <div class="stat-value" style="font-size: 1.5rem;">${client.total_sessions || 0}</div>
                            <div class="stat-label">Tong phien</div>
                        </div>
                    </div>
                    <div class="stat-card" style="padding: var(--space-4);">
                        <div class="stat-content">
                            <div class="stat-value" style="font-size: 1.5rem;">${client.pending_assignments || 0}</div>
                            <div class="stat-label">Bai tap dang cho</div>
                        </div>
                    </div>
                    <div class="stat-card" style="padding: var(--space-4);">
                        <div class="stat-content">
                            <div class="stat-value" style="font-size: 1.5rem;">${client.mood_average ? client.mood_average.toFixed(1) : '-'}</div>
                            <div class="stat-label">Tam trang TB</div>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <h4 class="mb-3">Hoat dong gan day</h4>
                    ${client.recent_activities && client.recent_activities.length > 0 ? `
                        <div style="border: 1px solid var(--color-border); border-radius: var(--radius-md);">
                            ${client.recent_activities.slice(0, 5).map((activity, i) => `
                                <div class="list-item" style="${i === 0 ? '' : 'border-top: 1px solid var(--color-border);'}">
                                    <div>
                                        <div class="font-medium">${activity.type}</div>
                                        <div class="text-sm text-muted">${formatDateTime(activity.created_at)}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<p class="text-muted">Chua co hoat dong</p>'}
                </div>

                <div class="flex gap-3 mt-6">
                    <button class="btn btn-secondary" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        Gui tin nhan
                    </button>
                    <button class="btn btn-secondary" onclick="createAppointment()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                        </svg>
                        Dat lich hen
                    </button>
                    <button class="btn btn-secondary" onclick="createAssignment()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <path d="M9 11l3 3L22 4"/>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                        Giao bai tap
                    </button>
                </div>
            `;
        }

        // Modal functions
        function openAddClientModal() {
            document.getElementById('add-client-modal').classList.add('open');
        }

        function closeAddClientModal() {
            document.getElementById('add-client-modal').classList.remove('open');
            document.getElementById('add-client-form').reset();
        }

        function closeClientDetailModal() {
            document.getElementById('client-detail-modal').classList.remove('open');
            selectedClientId = null;
        }

        // Pair client
        async function pairClient() {
            const code = document.getElementById('pairing-code').value.trim();
            const notes = document.getElementById('client-notes').value.trim();

            if (!code) {
                alert('Vui long nhap ma ghep noi');
                return;
            }

            try {
                await api.pairClient(code, notes);
                closeAddClientModal();
                loadClients();
                showSuccess('Da ghep noi thanh cong!');
            } catch (err) {
                console.error('Failed to pair:', err);
                alert(err.message || 'Khong the ghep noi');
            }
        }

        // View full profile
        function viewFullProfile() {
            if (selectedClientId) {
                window.location.href = `client-detail.html?id=${selectedClientId}`;
            }
        }

        // Action stubs
        function sendMessage() {
            if (selectedClientId) {
                window.location.href = `messages.html?client=${selectedClientId}`;
            }
        }

        function createAppointment() {
            if (selectedClientId) {
                window.location.href = `appointments.html?new=1&client=${selectedClientId}`;
            }
        }

        function createAssignment() {
            if (selectedClientId) {
                // TODO: Open assignment modal
                alert('Tinh nang dang phat trien');
            }
        }

        // Load unread count
        async function loadUnreadCount() {
            try {
                const count = await api.getUnreadCount();
                const badge = document.getElementById('unread-badge');
                if (count > 0) {
                    badge.textContent = count;
                    badge.style.display = 'inline-flex';
                }
            } catch (err) {
                console.error('Failed to load unread count:', err);
            }
        }

        // Helpers
        function formatDate(dateStr) {
            if (!dateStr) return 'Chua co';
            const date = new Date(dateStr);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            if (days === 0) return 'Hom nay';
            if (days === 1) return 'Hom qua';
            if (days < 7) return `${days} ngay truoc`;
            return date.toLocaleDateString('vi-VN');
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleString('vi-VN');
        }

        function truncate(str, len) {
            if (!str) return '';
            return str.length > len ? str.substring(0, len) + '...' : str;
        }

        function showSuccess(msg) {
            // TODO: Implement toast
            console.log('[SUCCESS]', msg);
        }

        function showError(msg) {
            // TODO: Implement toast
            console.error('[ERROR]', msg);
        }

        function logout() {
            localStorage.removeItem('user_id');
            window.location.href = '/app/auth';
        }
    </script>
</body>
</html>
