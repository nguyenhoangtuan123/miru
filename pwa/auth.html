                Đăng nhập
            </button>
</div>
<!-- Footer / Sign Up -->
<div class="flex-1 flex items-end justify-center pb-8 pt-8 z-10">
<p class="text-white/60 text-sm font-medium">
                Chưa có tài khoản? <a class="text-white font-bold hover:underline ml-1" href="#">Đăng ký ngay</a>
</p>
</div>
</div>

<script src="/config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    // Check if already logged in
    if (localStorage.getItem('user_id')) {
        window.location.href = '/app/orb';
    }

    // Google OAuth Handler
    document.querySelector('button:has(svg)').onclick = async function() {
        try {
            const client = google.accounts.oauth2.initTokenClient({
                client_id: '729581060162-elbo9t03gceb6q6keur3nup43qer1ba0.apps.googleusercontent.com',
                scope: 'openid profile email',
                callback: async (response) => {
                    if (response.access_token) {
                        const userInfo = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { 'Authorization': 'Bearer ' + response.access_token }
                        }).then(r => r.json());
                        
                        localStorage.setItem('user_id', userInfo.sub);
                        localStorage.setItem('user_name', userInfo.name);
                        localStorage.setItem('user_email', userInfo.email);
                        localStorage.setItem('user_picture', userInfo.picture);
                        
                        // Redirect to Living Orb (not dashboard!)
                        window.location.href = '/app/orb';
                    }
                }
            });
            client.requestAccessToken();
        } catch(e) {
            console.error('Google login error:', e);
            alert('Đăng nhập thất bại');
        }
    };
</script>
