<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#86B3F4">
    <title>Đăng nhập - Reflection</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/utilities.css">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #F5F8FF 0%, #E3EDFF 100%);
        }

        .dark body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
        }

        .login-container {
            max-width: 400px;
            width: 100%;
            padding: var(--spacing-2xl);
            background: var(--surface-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto var(--spacing-lg);
            background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        .app-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-tagline {
            color: var(--text-muted);
            margin-bottom: var(--spacing-2xl);
            font-size: 1rem;
        }

        .google-btn {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-lg);
            background: white;
            color: #1f1f1f;
            border: 1px solid #dadce0;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-md);
            transition: all var(--transition-fast);
        }

        .google-btn:hover {
            background: #f8f9fa;
            box-shadow: var(--shadow-md);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .divider {
            margin: var(--spacing-xl) 0;
            text-align: center;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--surface-secondary-light);
        }

        .dark .divider::before {
            background: var(--surface-secondary-dark);
        }

        .divider span {
            background: var(--surface-color);
            padding: 0 var(--spacing-md);
            position: relative;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .features {
            text-align: left;
            margin-top: var(--spacing-xl);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .feature-icon {
            color: var(--primary-light);
            font-size: 1.25rem;
        }

        .loading {
            display: none;
            margin-top: var(--spacing-md);
        }

        .loading.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="logo">💙</div>
        <h1 class="app-title">Reflection</h1>
        <p class="app-tagline">Trợ lý tâm lý với bộ nhớ dài hạn</p>

        <button class="google-btn" id="googleLoginBtn">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                <path fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Đăng nhập với Google
        </button>

        <div class="loading" id="loadingIndicator">
            <p class="text-muted">Đang chuyển hướng...</p>
        </div>

        <div class="divider">
            <span>Tính năng</span>
        </div>

        <div class="features">
            <div class="feature-item">
                <span class="material-symbols-outlined feature-icon">psychology</span>
                <span>Trò chuyện với AI tâm lý</span>
            </div>
            <div class="feature-item">
                <span class="material-symbols-outlined feature-icon">history</span>
                <span>Bộ nhớ dài hạn, ghi nhớ cuộc trò chuyện</span>
            </div>
            <div class="feature-item">
                <span class="material-symbols-outlined feature-icon">insights</span>
                <span>Theo dõi hành trình cảm xúc</span>
            </div>
            <div class="feature-item">
                <span class="material-symbols-outlined feature-icon">lock</span>
                <span>Bảo mật tuyệt đối, session 14 ngày</span>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // Check if already logged in
        checkAuth().then(user => {
            if (user) {
                // Already logged in, redirect to app
                window.location.href = '/app/chat';
            }
        });

        // Handle Google login button click
        googleLoginBtn.addEventListener('click', async () => {
            loadingIndicator.classList.add('active');
            googleLoginBtn.disabled = true;

            // Redirect to OAuth login endpoint
            window.location.href = '/auth/login';
        });
    </script>
</body>

</html>
