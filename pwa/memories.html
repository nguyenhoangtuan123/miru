    <script src="/config.js"></script>
    <script>
        const userId = localStorage.getItem('user_id');
        if (!userId) window.location.href = '/app/auth';

        const apiBase = window.APP_CONFIG?.getApiUrl?.() || '';

        // Load memories from API
        async function loadMemories() {
            const container = document.getElementById('memoryListContainer');
            const countEl = document.getElementById('memoryCount');

            try {
                const res = await fetch(apiBase + '/api/memories/' + userId);
                const data = await res.json();
                const memories = data.memories || data.results || [];

                if (memories.length === 0) {
                    container.innerHTML = '<div class="text-center py-8 text-white/40">Chưa có ký ức nào. Hãy trò chuyện với Miru!</div>';
                    countEl.textContent = '0 ký ức';
                    return;
                }

                countEl.textContent = memories.length + ' ký ức';
                container.innerHTML = memories.slice(0, 20).map(m => {
                    let text = m.memory || m.text || '';
                    // Parse if JSON string
                    if (typeof text === 'string' && text.startsWith('{')) {
                        try {
                            const parsed = JSON.parse(text);
                            text = parsed.title || parsed.summary || text;
                        } catch (e) { }
                    }
                    const date = new Date(m.created_at || Date.now()).toLocaleDateString('vi-VN');
                    return `
                <div class="glass-panel rounded-2xl p-4 flex gap-4 items-start group hover:bg-white/[0.07] transition-all cursor-pointer relative">
                    <div class="absolute top-0 left-0 w-1 h-full bg-primary/50"></div>
                    <div class="flex items-center justify-center rounded-xl bg-surface-dark shrink-0 size-12 border border-white/5">
                        <span class="material-symbols-outlined text-primary">psychology</span>
                    </div>
                    <div class="flex flex-1 flex-col min-w-0">
                        <p class="text-white text-base font-medium line-clamp-2">${text}</p>
                        <p class="text-white/30 text-xs mt-2 flex items-center gap-1">
                            <span class="material-symbols-outlined text-[14px]">schedule</span> ${date}
                        </p>
                    </div>
                </div>`;
                }).join('');
            } catch (e) {
                console.error('Load memories error:', e);
                container.innerHTML = '<div class="text-center py-8 text-red-400">Lỗi tải ký ức</div>';
            }
        }

        function renderMemoryList(memories) {
            // Kept for compatibility
        }

        // Tab switching
        const tabs = document.querySelectorAll('header + div button');
        let currentTab = 0;

        function switchTab(index) {
            currentTab = index;
            tabs.forEach((tab, i) => {
                const indicator = tab.querySelector('div:last-child');
                const text = tab.querySelector('p');
                if (i === index) {
                    text.classList.remove('text-white/50');
                    text.classList.add('text-white');
                    indicator.classList.remove('bg-transparent');
                    indicator.classList.add('bg-primary', 'shadow-glow');
                } else {
                    text.classList.remove('text-white');
                    text.classList.add('text-white/50');
                    indicator.classList.remove('bg-primary', 'shadow-glow');
                    indicator.classList.add('bg-transparent');
                }
            });

            if (index === 0) loadMemories();
            if (index === 1) loadKnowledgeGraph();
            if (index === 2) loadTimeline();
        }

        tabs.forEach((btn, i) => {
            btn.onclick = () => switchTab(i);
        });

        let network = null;

        // Knowledge Graph
        async function loadKnowledgeGraph() {
            const container = document.getElementById('memoryListContainer');
            container.innerHTML = `
            <div class="w-full">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-white font-bold flex items-center gap-2 text-lg">
                        <span class="material-symbols-outlined text-primary text-2xl">hub</span>
                        Knowledge Graph
                    </h3>
                    <div class="flex gap-2">
                        <button id="zoomIn" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white/60 hover:text-white transition-all">
                            <span class="material-symbols-outlined text-sm">add</span>
                        </button>
                        <button id="zoomOut" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white/60 hover:text-white transition-all">
                            <span class="material-symbols-outlined text-sm">remove</span>
                        </button>
                        <button id="fitGraph" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white/60 hover:text-white transition-all">
                            <span class="material-symbols-outlined text-sm">fit_screen</span>
                        </button>
                    </div>
                </div>
                <div id="graphContainer" class="w-full aspect-square max-h-[700px] min-h-[500px] bg-[#0d0a1a] rounded-2xl relative overflow-hidden border border-white/10">
                    <div id="graphLoader" class="absolute inset-0 flex items-center justify-center text-white/40">
                        <div class="flex flex-col items-center gap-3">
                            <div class="w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin"></div>
                            Đang xây dựng bản đồ tri thức...
                        </div>
                    </div>
                </div>
                <div id="graphLegend" class="flex flex-wrap justify-center gap-6 mt-4 py-3 px-4 bg-white/5 rounded-xl">
                    <div class="flex items-center gap-2"><span class="size-4 rounded-full bg-primary shadow-lg shadow-primary/50"></span> <span class="text-white/70 text-sm">Bạn</span></div>
                    <div class="flex items-center gap-2"><span class="size-4 rounded-full bg-amber-400 shadow-lg shadow-amber-400/50"></span> <span class="text-white/70 text-sm">Sở thích</span></div>
                    <div class="flex items-center gap-2"><span class="size-4 rounded-full bg-emerald-400 shadow-lg shadow-emerald-400/50"></span> <span class="text-white/70 text-sm">Cảm xúc</span></div>
                    <div class="flex items-center gap-2"><span class="size-4 rounded-full bg-blue-400 shadow-lg shadow-blue-400/50"></span> <span class="text-white/70 text-sm">Con người</span></div>
                    <div class="flex items-center gap-2"><span class="size-4 rounded-full bg-pink-400 shadow-lg shadow-pink-400/50"></span> <span class="text-white/70 text-sm">Mục tiêu</span></div>
                    <div class="flex items-center gap-2"><span class="size-4 rounded-full bg-slate-400 shadow-lg shadow-slate-400/50"></span> <span class="text-white/70 text-sm">Khác</span></div>
                </div>
            </div>
        `;

            try {
                const res = await fetch(apiBase + '/api/memories/' + userId + '/graph');
                const data = await res.json();

                document.getElementById('graphLoader').style.display = 'none';

                if (!data.success || !data.graph?.nodes?.length) {
                    document.getElementById('graphContainer').innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-white/40 px-6 text-center">Chưa đủ dữ liệu để ánh xạ tri thức. Hãy trò chuyện thêm!</div>';
                    return;
                }

                const nodes = [];
                const edges = [];

                // Central node - YOU (large, prominent)
                nodes.push({
                    id: 'user',
                    label: data.graph.central_node?.label || 'Bạn',
                    color: {
                        background: '#7f0df2',
                        border: '#a855f7',
                        highlight: { background: '#a855f7', border: '#c084fc' },
                        hover: { background: '#9333ea', border: '#c084fc' }
                    },
                    font: { color: '#ffffff', size: 16, face: 'Space Grotesk', vadjust: 0 },
                    shape: 'circle',
                    size: 50,
                    borderWidth: 4,
                    shadow: { enabled: true, color: 'rgba(127,13,242,0.6)', size: 20, x: 0, y: 0 }
                });

                // Node colors by type - bright, distinct colors like Neo4j
                const typeConfig = {
                    'preference': { bg: '#fbbf24', border: '#d97706', textColor: '#1c1917' },
                    'emotion': { bg: '#34d399', border: '#059669', textColor: '#022c22' },
                    'person': { bg: '#60a5fa', border: '#2563eb', textColor: '#172554' },
                    'attribute': { bg: '#c4b5fd', border: '#8b5cf6', textColor: '#2e1065' },
                    'goal': { bg: '#f472b6', border: '#db2777', textColor: '#500724' }
                };

                data.graph.nodes.forEach((n, idx) => {
                    const config = typeConfig[n.type] || { bg: '#94a3b8', border: '#475569', textColor: '#0f172a' };

                    // Short label for display
                    let label = n.label || '';
                    if (label.length > 15) label = label.substring(0, 13) + '..';

                    nodes.push({
                        id: n.id,
                        label: label,
                        title: n.label, // Full text on hover tooltip
                        color: {
                            background: config.bg,
                            border: config.border,
                            highlight: { background: config.border, border: config.bg },
                            hover: { background: config.border, border: config.bg }
                        },
                        font: {
                            color: config.textColor,
                            size: 12,
                            face: 'Noto Sans',
                            vadjust: 0
                        },
                        shape: 'circle',
                        size: 35,
                        borderWidth: 3,
                        shadow: { enabled: true, color: 'rgba(0,0,0,0.3)', size: 8, x: 2, y: 2 }
                    });
                });

                // Edges - clean arrows
                data.graph.edges.forEach(e => {
                    edges.push({
                        from: e.from,
                        to: e.to,
                        color: {
                            color: '#6366f1',
                            highlight: '#818cf8',
                            hover: '#818cf8',
                            opacity: 0.8
                        },
                        arrows: {
                            to: { enabled: true, scaleFactor: 0.8, type: 'arrow' }
                        },
                        smooth: {
                            enabled: true,
                            type: 'dynamic',
                            roundness: 0.5
                        },
                        width: 2,
                        hoverWidth: 3
                    });
                });

                const container_el = document.getElementById('graphContainer');
                const graphData = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };

                const options = {
                    physics: {
                        enabled: true,
                        barnesHut: {
                            gravitationalConstant: -4000,
                            centralGravity: 0.15,
                            springLength: 250,
                            springConstant: 0.02,
                            damping: 0.15,
                            avoidOverlap: 0.5
                        },
                        stabilization: {
                            enabled: true,
                            iterations: 200,
                            fit: true,
                            updateInterval: 25
                        },
                        minVelocity: 0.75
                    },
                    interaction: {
                        hover: true,
                        hoverConnectedEdges: true,
                        tooltipDelay: 100,
                        zoomView: true,
                        dragView: true,
                        dragNodes: true
                    },
                    nodes: {
                        scaling: {
                            min: 20,
                            max: 60
                        }
                    },
                    edges: {
                        scaling: {
                            min: 1,
                            max: 4
                        }
                    }
                };

                network = new vis.Network(container_el, graphData, options);

                // Zoom controls
                document.getElementById('zoomIn').onclick = () => {
                    const scale = network.getScale() * 1.3;
                    network.moveTo({ scale });
                };
                document.getElementById('zoomOut').onclick = () => {
                    const scale = network.getScale() / 1.3;
                    network.moveTo({ scale });
                };
                document.getElementById('fitGraph').onclick = () => {
                    network.fit({ animation: true });
                };

                // Store nodes data for click handler
                const nodesData = {};
                data.graph.nodes.forEach(n => {
                    nodesData[n.id] = n;
                });
                nodesData['user'] = { label: data.graph.central_node?.label || 'Bạn', full_text: 'Đây là bạn - trung tâm của bản đồ tri thức', type: 'person' };

                // Click on node to show details
                network.on('click', function (params) {
                    if (params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        const nodeInfo = nodesData[nodeId];

                        if (nodeInfo) {
                            const typeNames = {
                                'preference': '⭐ Sở thích',
                                'emotion': '💭 Cảm xúc',
                                'person': '👤 Con người',
                                'attribute': '📌 Thuộc tính',
                                'goal': '🎯 Mục tiêu'
                            };

                            const typeName = typeNames[nodeInfo.type] || '📝 Ký ức';
                            const sentiment = nodeInfo.sentiment === 'positive' ? '😊 Tích cực' :
                                nodeInfo.sentiment === 'negative' ? '😔 Tiêu cực' : '😐 Trung tính';

                            // Create or update detail panel
                            let detailPanel = document.getElementById('nodeDetailPanel');
                            if (!detailPanel) {
                                detailPanel = document.createElement('div');
                                detailPanel.id = 'nodeDetailPanel';
                                detailPanel.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 w-[90%] max-w-md z-50';
                                document.body.appendChild(detailPanel);
                            }

                            detailPanel.innerHTML = `
                                <div class="bg-surface-dark/95 backdrop-blur-xl rounded-2xl p-5 border border-white/10 shadow-2xl animate-in slide-in-from-bottom-4">
                                    <div class="flex justify-between items-start mb-3">
                                        <span class="px-3 py-1 rounded-full text-xs font-medium" style="background: ${typeConfig[nodeInfo.type]?.bg || '#94a3b8'}; color: ${typeConfig[nodeInfo.type]?.textColor || '#0f172a'}">${typeName}</span>
                                        <button onclick="document.getElementById('nodeDetailPanel').remove()" class="text-white/40 hover:text-white p-1">
                                            <span class="material-symbols-outlined text-lg">close</span>
                                        </button>
                                    </div>
                                    <p class="text-white text-base leading-relaxed mb-3">${nodeInfo.full_text || nodeInfo.label}</p>
                                    <div class="flex items-center gap-4 text-sm text-white/50">
                                        <span>${sentiment}</span>
                                    </div>
                                </div>
                            `;

                            // Auto-hide after 8 seconds
                            setTimeout(() => {
                                const panel = document.getElementById('nodeDetailPanel');
                                if (panel) panel.remove();
                            }, 8000);
                        }
                    }
                });

            } catch (e) {
                console.error('Load graph error:', e);
                document.getElementById('graphContainer').innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-red-400">Lỗi kết nối Graph</div>';
            }
        }

        // Timeline
        async function loadTimeline() {
            const container = document.getElementById('memoryListContainer');
            container.innerHTML = '<div class="text-center py-8 text-white/40">Đang tải Timeline...</div>';

            try {
                const res = await fetch(apiBase + '/api/insights/timeline/' + userId);
                const data = await res.json();
                const items = data.timeline || [];

                if (items.length === 0) {
                    container.innerHTML = '<div class="text-center py-8 text-white/40">Chưa có dữ liệu timeline</div>';
                    return;
                }

                // Get emotion color
                function getEmotionColor(summary) {
                    const s = (summary || '').toLowerCase();
                    if (s.includes('vui') || s.includes('hạnh phúc')) return 'bg-amber-500';
                    if (s.includes('buồn') || s.includes('khóc')) return 'bg-blue-500';
                    if (s.includes('stress') || s.includes('lo âu') || s.includes('lo lắng')) return 'bg-red-500';
                    if (s.includes('bình yên') || s.includes('thư giãn')) return 'bg-emerald-500';
                    return 'bg-primary';
                }

                container.innerHTML = `
                <div class="relative pl-4 pr-1">
                    <!-- Vertical line -->
                    <div class="absolute left-3 top-2 bottom-4 w-0.5 bg-gradient-to-b from-primary via-white/10 to-transparent opacity-30"></div>
                    
                    ${items.map((item, i) => `
                        <div class="relative mb-8 last:mb-0">
                            <!-- Timeline dot -->
                            <div class="absolute left-[-1.1rem] top-2.5 size-4 rounded-full ${getEmotionColor(item.summary)} shadow-[0_0_12px_rgba(0,0,0,0.5)] border-[3px] border-background-dark z-10 transition-transform hover:scale-125"></div>
                            
                            <!-- Content card -->
                            <div class="glass-panel rounded-2xl p-5 ml-4 hover:bg-white/[0.08] transition-all border-l-2 border-l-primary/30 active:scale-[0.98]">
                                <div class="flex justify-between items-center mb-3">
                                    <h4 class="text-white font-bold text-sm tracking-tight">${item.title || 'Phiên trò chuyện'}</h4>
                                    <div class="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-white/5 border border-white/5">
                                        <span class="material-symbols-outlined text-[12px] text-white/40">calendar_today</span>
                                        <span class="text-white/40 text-[10px] font-bold uppercase tracking-tighter">${item.date || ''}</span>
                                    </div>
                                </div>
                                <p class="text-white/70 text-sm leading-relaxed font-light">${item.summary || 'Trò chuyện về nhiều chủ đề...'}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            } catch (e) {
                console.error('Load timeline error:', e);
                container.innerHTML = '<div class="text-center py-8 text-red-400">Lỗi tải Timeline</div>';
            }
        }

        // Bottom nav links
        document.querySelectorAll('nav a').forEach((a, i) => {
            const links = ['/app/orb', '/app/memories', '/app/chat', '/app'];
            a.href = links[i];
        });

        loadMemories();
    </script>
</body>

</html>
