<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#86B3F4">
    <title>Lịch sử - Reflection</title>
    <link rel="manifest" href="/manifest.json">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/utilities.css">

    <style>
        .history-container {
            padding: var(--spacing-md);
            padding-bottom: 80px;
        }

        .history-item {
            background: var(--surface-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-base);
        }

        .dark .history-item {
            background: var(--surface-dark);
        }

        .history-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-sm);
        }

        .history-date {
            font-size: 0.875rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .history-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: var(--spacing-xs);
        }

        .history-preview {
            color: var(--text-muted);
            font-size: 0.875rem;
            line-height: 1.5;
            margin-bottom: var(--spacing-sm);
        }

        .history-meta {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            align-items: center;
        }

        .emotion-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .emotion-high {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-success);
        }

        .emotion-medium {
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent-warning);
        }

        .emotion-low {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-danger);
        }

        .tag-badge {
            padding: 4px 8px;
            background: var(--surface-secondary-light);
            color: var(--text-color);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
        }

        .dark .tag-badge {
            background: var(--surface-secondary-dark);
        }

        .history-actions {
            display: flex;
            gap: var(--spacing-xs);
        }

        .action-btn {
            padding: 4px 8px;
            background: none;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-muted);
            transition: all var(--transition-fast);
        }

        .action-btn:hover {
            background: var(--surface-secondary-light);
            color: var(--text-color);
        }

        .dark .action-btn:hover {
            background: var(--surface-secondary-dark);
        }

        .history-full {
            margin-top: var(--spacing-sm);
            padding-top: var(--spacing-sm);
            border-top: 1px solid var(--surface-secondary-light);
            font-size: 0.875rem;
            line-height: 1.6;
            display: none;
        }

        .dark .history-full {
            border-top-color: var(--surface-secondary-dark);
        }

        .history-full.expanded {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--text-muted);
        }

        .loading-state {
            text-align: center;
            padding: var(--spacing-xl);
        }
    </style>
    <!-- Environment Config -->
    <script src="/config.js"></script>
</head>

<body>
    <!-- Dark Mode Toggle -->
    <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Toggle dark mode">
        <span class="material-symbols-outlined dark-only">light_mode</span>
        <span class="material-symbols-outlined light-only">dark_mode</span>
    </button>

    <!-- App Container -->
    <div class="app-wrapper">
        <!-- Header -->
        <header class="app-header">
            <button class="icon-button" onclick="window.location.href='/app'">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>

            <div style="flex: 1; text-align: center;">
                <div class="header-title">Lịch sử trò chuyện</div>
                <div class="header-subtitle" id="sessionCount">Đang tải...</div>
            </div>

            <button class="icon-button" id="menuButton">
                <span class="material-symbols-outlined">more_vert</span>
            </button>
        </header>

        <!-- History Timeline -->
        <div class="history-container" id="historyContainer">
            <div class="loading-state">
                <span class="material-symbols-outlined"
                    style="font-size: 48px; color: var(--primary-light);">history</span>
                <p>Đang tải lịch sử...</p>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="nav-bar">
            <a href="/app" class="nav-item">
                <span class="material-symbols-outlined">home</span>
                <span>Trang chủ</span>
            </a>
            <a href="/app/insights" class="nav-item">
                <span class="material-symbols-outlined">insights</span>
                <span>Hành trình</span>
            </a>
            <a href="/app/settings" class="nav-item">
                <span class="material-symbols-outlined">settings</span>
                <span>Cài đặt</span>
            </a>
        </nav>
    </div>

    <script>
        // Dark mode toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const darkOnly = document.querySelectorAll('.dark-only');
        const lightOnly = document.querySelectorAll('.light-only');

        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.documentElement.classList.add('dark');
            darkOnly.forEach(el => el.style.display = 'block');
            lightOnly.forEach(el => el.style.display = 'none');
        } else {
            darkOnly.forEach(el => el.style.display = 'none');
            lightOnly.forEach(el => el.style.display = 'block');
        }

        darkModeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');

            darkOnly.forEach(el => el.style.display = isDark ? 'block' : 'none');
            lightOnly.forEach(el => el.style.display = isDark ? 'none' : 'block');
        });

        // Load conversation history
        async function loadHistory() {
            const userId = localStorage.getItem('user_id'); if (!userId) { window.location.href = '/app/auth'; }
            const container = document.getElementById('historyContainer');
            const sessionCount = document.getElementById('sessionCount');

            try {
                const response = await fetch(`${window.APP_CONFIG.getApiUrl()}/api/history/${userId}?days=30`);
                const data = await response.json();

                if (!data.success || data.sessions.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <span class="material-symbols-outlined" style="font-size: 64px; opacity: 0.3;">chat_bubble_outline</span>
                            <p>Chưa có lịch sử trò chuyện</p>
                        </div>
                    `;
                    sessionCount.textContent = 'Không có phiên nào';
                    return;
                }

                sessionCount.textContent = `${data.count} phiên`;

                container.innerHTML = data.sessions.map(session => {
                    const emotionClass = session.emotion_score >= 7 ? 'emotion-high' :
                        session.emotion_score >= 5 ? 'emotion-medium' : 'emotion-low';

                    const emotionIcon = session.emotion_score >= 7 ? 'sentiment_satisfied' :
                        session.emotion_score >= 5 ? 'sentiment_neutral' : 'sentiment_dissatisfied';

                    return `
                        <div class="history-item" data-id="${session.id}">
                            <div class="history-header">
                                <div class="history-date">
                                    <span class="material-symbols-outlined" style="font-size: 16px;">calendar_today</span>
                                    ${session.date} ${session.time}
                                </div>
                                <div class="history-actions">
                                    <button class="action-btn expand-btn" onclick="toggleExpand(${session.id})">
                                        <span class="material-symbols-outlined">expand_more</span>
                                    </button>
                                    <button class="action-btn delete-btn" onclick="deleteSession(${session.id})">
                                        <span class="material-symbols-outlined">delete</span>
                                    </button>
                                </div>
                            </div>

                            <div class="history-title">${session.title}</div>
                            <div class="history-preview">${session.preview}</div>

                            <div class="history-meta">
                                <span class="emotion-badge ${emotionClass}">
                                    <span class="material-symbols-outlined" style="font-size: 14px;">${emotionIcon}</span>
                                    ${session.emotion_score}/10
                                </span>
                                ${session.tags.map(tag => `<span class="tag-badge">#${tag}</span>`).join('')}
                            </div>

                            <div class="history-full" id="full-${session.id}">
                                ${session.full_text.replace(/\n/g, '<br>')}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading history:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="color: var(--accent-danger);">Lỗi khi tải lịch sử</p>
                    </div>
                `;
            }
        }

        function toggleExpand(sessionId) {
            const fullText = document.getElementById(`full-${sessionId}`);
            const btn = event.target.closest('.expand-btn');
            const icon = btn.querySelector('.material-symbols-outlined');

            fullText.classList.toggle('expanded');
            icon.textContent = fullText.classList.contains('expanded') ? 'expand_less' : 'expand_more';
        }

        async function deleteSession(sessionId) {
            if (!confirm('Bạn có chắc muốn xóa phiên này?')) return;

            try {
                const response = await fetch(`${window.APP_CONFIG.getApiUrl()}/api/history/session/${sessionId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    // Remove from UI
                    const item = document.querySelector(`[data-id="${sessionId}"]`);
                    item.style.opacity = '0';
                    setTimeout(() => {
                        item.remove();
                        // Update count
                        const remaining = document.querySelectorAll('.history-item').length;
                        document.getElementById('sessionCount').textContent = `${remaining} phiên`;
                    }, 300);
                } else {
                    alert('Lỗi khi xóa phiên');
                }
            } catch (error) {
                console.error('Error deleting session:', error);
                alert('Lỗi khi xóa phiên');
            }
        }

        // Load history on page load
        loadHistory();
    </script>
</body>

</html>
