<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miru - AI hiểu bạn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #f0f4ff 0%, #e8f0ff 50%, #f8f9ff 100%);
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 32px;
        }

        .chat-box {
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 16px;
            margin-bottom: 24px;
        }

        .messages {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 12px;
            display: none;
        }

        .messages.has-messages {
            display: block;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 16px;
            margin: 8px 0;
            max-width: 85%;
            line-height: 1.5;
        }

        .msg.user {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            margin-left: auto;
        }

        .msg.ai {
            background: #f1f5f9;
            color: #1e293b;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        .input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input:focus {
            border-color: #6366f1;
        }

        .send-btn {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .suggestion {
            padding: 8px 16px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            font-size: 13px;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion:hover {
            background: #f1f5f9;
            border-color: #6366f1;
            color: #6366f1;
        }

        .nav-link {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            text-decoration: none;
            color: #64748b;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .nav-link:hover {
            color: #6366f1;
        }

        .rich-component {
            margin: 12px 0;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
        }

        .graph-container {
            height: 250px;
            background: linear-gradient(135deg, #f0f4ff, #faf5ff);
            border-radius: 8px;
        }
    </style>
    <script src="/config.js"></script>
    <script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
    <a href="/app" class="nav-link">📋 Menu đầy đủ</a>

    <div class="container">
        <div class="logo">🧠</div>
        <div class="title">Miru</div>
        <div class="subtitle">AI hiểu bạn - Chỉ cần nói, mình sẽ hiểu</div>

        <div class="chat-box">
            <div class="messages" id="messages"></div>
            <div class="input-row">
                <input type="text" class="input" id="input" placeholder="Hãy nói với Miru..." autocomplete="off">
                <button class="send-btn" id="sendBtn">➤</button>
            </div>
        </div>

        <div class="suggestions">
            <span class="suggestion" data-msg="Tuần này tôi thế nào?">📊 Tuần này tôi thế nào?</span>
            <span class="suggestion" data-msg="Phân tích cảm xúc của tôi">🎭 Cảm xúc của tôi</span>
            <span class="suggestion" data-msg="Xem mối quan hệ ký ức">🕸️ Mối quan hệ</span>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('user_id') || 'default_user';
        const apiBase = window.APP_CONFIG?.getApiUrl?.() || '';
        const messages = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        let ws = null;

        // Connect WebSocket
        function connectWS() {
            const wsUrl = (window.APP_CONFIG?.getWsUrl?.() || 'ws://localhost:8000') + '/ws/chat/' + userId;
            ws = new WebSocket(wsUrl);
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'ai_response' || data.type === 'stream_end') {
                    addMsg(data.content || data.message, 'ai');
                }
            };
            ws.onerror = () => setTimeout(connectWS, 3000);
            ws.onclose = () => setTimeout(connectWS, 3000);
        }
        connectWS();

        // Send message
        async function send() {
            const msg = input.value.trim();
            if (!msg) return;

            addMsg(msg, 'user');
            input.value = '';
            sendBtn.disabled = true;

            // Check for rich UI triggers
            const richHtml = await checkRichUI(msg);
            if (richHtml) {
                addRichMsg(richHtml);
                sendBtn.disabled = false;
                return;
            }

            // Send to WebSocket
            if (ws?.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ message: msg }));
            }
            sendBtn.disabled = false;
        }

        async function checkRichUI(msg) {
            const m = msg.toLowerCase();

            // Graph trigger
            if (m.includes('graph') || m.includes('quan hệ') || m.includes('mối')) {
                try {
                    const res = await fetch(apiBase + '/api/memories/' + userId + '/graph');
                    const data = await res.json();
                    if (data.success && data.graph?.central_node) {
                        return renderGraph(data.graph);
                    }
                } catch (e) { }
            }

            // Emotion trigger
            if (m.includes('cảm xúc') || m.includes('tâm trạng') || m.includes('tuần này')) {
                try {
                    const res = await fetch(apiBase + '/api/emotions/chart/' + userId);
                    const data = await res.json();
                    if (data.emotions?.length) {
                        return renderEmotionChart(data);
                    }
                } catch (e) { }
            }

            return null;
        }

        function renderGraph(graph) {
            const id = 'graph-' + Date.now();
            setTimeout(() => {
                const container = document.getElementById(id);
                if (!container) return;
                const nodes = new vis.DataSet([
                    { id: 'user', label: graph.central_node.label, color: '#a78bfa', shape: 'circle', size: 30 },
                    ...graph.nodes.map(n => ({ id: n.id, label: n.label, color: n.sentiment === 'positive' ? '#a5f3fc' : n.sentiment === 'negative' ? '#fecdd3' : '#c7d2fe', shape: 'box' }))
                ]);
                const edges = new vis.DataSet(graph.edges.map((e, i) => ({ id: 'e' + i, from: e.from, to: e.to, label: e.label })));
                new vis.Network(container, { nodes, edges }, { physics: { stabilization: { iterations: 80 } } });
            }, 100);
            return '<div class="rich-component"><b>🕸️ Knowledge Graph</b><div id="' + id + '" class="graph-container"></div></div>';
        }

        function renderEmotionChart(data) {
            const id = 'chart-' + Date.now();
            setTimeout(() => {
                const canvas = document.getElementById(id);
                if (!canvas) return;
                new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{ data: data.emotions, borderColor: '#6366f1', backgroundColor: 'rgba(99,102,241,0.1)', fill: true, tension: 0.4 }]
                    },
                    options: { responsive: true, maintainAspectRatio: true, aspectRatio: 2, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 10 } } }
                });
            }, 100);
            return '<div class="rich-component"><b>📊 Biểu đồ cảm xúc</b><div style="max-width:400px;height:180px;"><canvas id="' + id + '"></canvas></div></div>';
        }

        function addMsg(text, type) {
            messages.classList.add('has-messages');
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function addRichMsg(html) {
            messages.classList.add('has-messages');
            const div = document.createElement('div');
            div.className = 'msg ai';
            div.innerHTML = html;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        // Events
        sendBtn.onclick = send;
        input.onkeypress = (e) => { if (e.key === 'Enter') send(); };
        document.querySelectorAll('.suggestion').forEach(s => {
            s.onclick = () => { input.value = s.dataset.msg; send(); };
        });
    </script>
</body>

</html>
