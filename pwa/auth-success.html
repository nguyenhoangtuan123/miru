<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Đăng nhập thành công - Miru</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #191022;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(127, 13, 242, 0.3);
            border-top-color: #7f0df2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Đang đăng nhập...</p>
    </div>
    
    <script>
        // Get user info from URL params
        const params = new URLSearchParams(window.location.search);
        
        const userId = params.get('user_id');
        const userName = params.get('user_name');
        const userEmail = params.get('user_email');
        const userPicture = params.get('user_picture');
        
        if (userId) {
            // Save to localStorage
            localStorage.setItem('user_id', userId);
            if (userName) localStorage.setItem('user_name', userName);
            if (userEmail) localStorage.setItem('user_email', userEmail);
            if (userPicture) localStorage.setItem('user_picture', userPicture);
            
            console.log('[Auth Success] User saved to localStorage:', userId);
            
            // Redirect to app
            window.location.href = '/app/orb';
        } else {
            // No user info, go back to auth
            console.error('[Auth Success] No user info in URL');
            window.location.href = '/app/auth';
        }
    </script>
</body>
</html>
